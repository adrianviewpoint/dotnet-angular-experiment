  <ul class="list-disc pl-5 space-y-2">
    <li>
      Backend API example:
      <a href="/api/health" target="_blank" rel="noreferrer" class="text-blue-600">GET /api/health</a>
    </li>
    <li>
      <div class="font-medium">Backend API example: POST /api/echo</div>
      <div>
        <button (click)="callEcho()" [disabled]="isCalling()" class="mt-2 inline-flex items-center rounded bg-blue-600 px-3 py-1.5 text-white hover:bg-blue-700 disabled:opacity-50">
          {{ isCalling() ? 'Sending…' : 'Send sample POST' }}
        </button>
      </div>
      <ng-container *ngIf="echoResult() as echo">
        <pre class="bg-gray-100 p-3 mt-2 rounded text-sm overflow-auto">{{ echo }}</pre>
      </ng-container>
    </li>
  </ul>

  <p class="text-gray-700">
    Auth is mounted at <code class="bg-gray-100 px-1 py-0.5 rounded">/api/auth/*</code>.
  </p>
</section>
